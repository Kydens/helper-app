services:
  api:
    build: .
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env.container
    depends_on:
      - db
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${USER_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
      POSTGRES_DB: ${NAME_DB}
    ports:
      - '5432:${PORT_DB}'
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6379:${REDIS_PORT}'

volumes:
  db_data:
